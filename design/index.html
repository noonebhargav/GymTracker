<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GymTracker — Design System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <style>
    /* Stage chrome */
    html, body { height: 100%; }
    body {
      background:
        radial-gradient(ellipse at 30% 10%, rgba(216,254,61,0.06), transparent 50%),
        radial-gradient(ellipse at 70% 90%, rgba(94,195,255,0.05), transparent 50%),
        #0a0b0d;
      font-family: 'Inter', system-ui, sans-serif;
      color: #f4f5f7;
      overflow: hidden;
    }
    .stage {
      position: fixed; inset: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      padding: 24px;
    }
    .stage-side {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px 24px;
      min-width: 0;
    }
    .stage-brand {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.02em;
      display: flex; align-items: center; gap: 10px;
    }
    .stage-brand i {
      display: inline-block; width: 14px; height: 14px;
      background: #d8fe3d; border-radius: 4px;
      transform: rotate(45deg);
    }
    .stage-sub {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
      font-family: 'Space Grotesk', sans-serif;
      margin-top: 6px;
      max-width: 240px;
      line-height: 1.5;
    }
    .stage-tag {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }
    .stage-tag b {
      color: #d8fe3d;
      letter-spacing: -0.01em;
      font-size: 14px;
      text-transform: none;
      display: block;
      margin-top: 4px;
      font-weight: 700;
    }
    .device-wrap {
      filter: drop-shadow(0 30px 60px rgba(0,0,0,0.4));
    }

    /* Force android-frame to look at home in our stage */
    .device-wrap > div {
      border-color: rgba(255,255,255,0.08) !important;
      background: #0a0b0d !important;
    }

    /* Tablet/desktop: side rails. Narrower: hide them. */
    @media (max-width: 900px) {
      .stage { grid-template-columns: 1fr; padding: 12px; }
      .stage-side { display: none; }
    }

    /* No-scroll for whole page; the app scrolls inside */
    .root-anchor { display: contents; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="stage-side">
      <div>
        <div class="stage-brand"><i></i> GymTracker</div>
        <div class="stage-sub">A high-contrast, sporty redesign with realistic data and new insights.</div>
      </div>
      <div>
        <div class="stage-tag">Design System v2<b>Android · 412 × 892</b></div>
        <div class="stage-tag" style="margin-top: 20px;">Try the tweaks panel<b>↘ bottom right</b></div>
      </div>
    </div>

    <div class="device-wrap">
      <div id="root"></div>
    </div>

    <div class="stage-side" style="align-items: flex-end; text-align: right;">
      <div>
        <div class="stage-tag">Type<b>Space Grotesk · Inter</b></div>
        <div class="stage-tag" style="margin-top: 20px;">Accent<b style="color: #d8fe3d;">#D8FE3D Electric Lime</b></div>
      </div>
      <div>
        <div class="stage-tag">Try
          <b>Workout · Set editor</b>
        </div>
        <div class="stage-tag" style="margin-top: 20px;">
          History · Insights<b>volume + heatmap</b>
        </div>
      </div>
    </div>
  </div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="android-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="ui.jsx"></script>
  <script type="text/babel" src="workout.jsx"></script>
  <script type="text/babel" src="routine.jsx"></script>
  <script type="text/babel" src="explore.jsx"></script>
  <script type="text/babel" src="history.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
